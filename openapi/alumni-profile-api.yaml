openapi: 3.0.3
info:
  title: Alumni Profile API
  version: 0.9.0
  description: Draft API for managing alumni profiles, under development.
  

servers:
  - url: http://localhost:3000

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:

  /api/v1/profile/me:
    get:
      summary: Get my own profile
      security:
        - bearerAuth: []
      responses:
        '200': { description: Profile fetched }
        '401': { description: Unauthorized }

  /api/v1/profile/{id}:
    get:
      summary: Get alumni profile by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Profile fetched }
        '401': { description: Unauthorized }
        '404': { description: Profile not found }

    patch:
      summary: Update own profile (cannot update others)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              properties:
                company:     { type: string }
                jobTitle:    { type: string }
                location:    { type: string }
                linkedinUrl: { type: string }
                skills:      { type: array, items: { type: string } }
                bio:         { type: string }
      responses:
        '200': { description: Profile updated }
        '401': { description: Unauthorized }
        '403': { description: Forbidden - cannot update another user's profile }
        '404': { description: Profile not found }