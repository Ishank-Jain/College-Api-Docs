openapi: 3.0.3
info:
  title: Events API
  version: 1.0.0

servers:
  - url: http://localhost:3000

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:

  /api/v1/events:
    get:
      summary: Get all events
      security:
        - bearerAuth: []
      responses:
        '200': { description: Events fetched }
        '401': { description: Unauthorized }

    post:
      summary: Create event (alumni/admin only)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              properties:
                title:                { type: string }
                description:          { type: string }
                type:                 { type: string }
                mode:                 { type: string, enum: [online, offline, hybrid] }
                dateTime:             { type: string, format: date-time }
                venue:                { type: string }
                organizer:            { type: string }
                registrationDeadline: { type: string, format: date-time }
      responses:
        '201': { description: Event created }
        '401': { description: Unauthorized }
        '403': { description: Forbidden - alumni/admin only }

  /api/v1/events/{id}:
    get:
      summary: Get event by ID
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Event fetched }
        '401': { description: Unauthorized }
        '404': { description: Event not found }

  /api/v1/events/{id}/register:
    post:
      summary: Register for an event
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Registered successfully }
        '401': { description: Unauthorized }
        '404': { description: Event not found }

  /api/v1/webhooks/event-notification:
    post:
      summary: Receive event notification webhook
      # No auth - external webhook receiver
      requestBody:
        content:
          application/json:
            schema:
              properties:
                eventId:   { type: string }
                eventType: { type: string }
                message:   { type: string }
                sentAt:    { type: string, format: date-time }
      responses:
        '200': { description: Webhook received }
        '400': { description: Invalid payload }